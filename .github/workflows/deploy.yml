name: Deploy to GoDaddy (FTPS)

# Ships the repo to its GoDaddy doc root on every push to main.
# The FTP account is chrooted to this site's doc root, so server-dir is ./.
#
# SAFETY: dangerous-clean-slate stays false. On growthbastards.com (main domain,
# doc root = /public_html) it must NEVER be enabled — cleaning would delete every
# sibling site. dry-run is true for the first validated pass; flip to false after
# the log review.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Refuse to ship a page that crawlers would read as blank. A design-tool bundle
      # rebuilds itself with JavaScript; GPTBot, ClaudeBot and most link previewers
      # never run it. Fix: website_ops/runbooks/after-a-design-export.md
      - name: Crawlability gate
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          skip = {"node_modules", "documents", "Documentation", "build"}
          bad = []
          for p in sorted(pathlib.Path(".").rglob("*.html")):
              if skip & set(p.parts) or any(part.startswith(".") for part in p.parts):
                  continue
              s = p.read_text(errors="ignore")
              head = s[: s.find("<body")] if "<body" in s else s
              if re.search(r'<meta[^>]*name="robots"[^>]*noindex', head):
                  continue
              if "__bundler/template" in s and 'id="__prerender"' not in s:
                  bad.append(f"  {p}: design bundle with no readable copy inside")
          if bad:
              print("These pages would reach crawlers as blank pages:")
              print("\n".join(bad))
              print("Run the converter: website_ops/runbooks/after-a-design-export.md")
              sys.exit(1)
          print("Crawlability gate: every indexable page has readable HTML.")
          PY

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ./
          local-dir: ./
          dangerous-clean-slate: false
          dry-run: false         # validated via dry-run 2026-07-09
          # Outward filter: belongs in git, not on the web server (tidiness, not secrecy).
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            .gitignore
            README.md
            Documentation/**
            documents/**
            config.sample.php
            netlify.toml
